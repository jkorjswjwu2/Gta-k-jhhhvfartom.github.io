<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المهام وإرسال بيانات المتصفح للإيميل</title>
    <!-- استدعاء تايليند سي إس إس للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <div class="w-full max-w-xl bg-neutral-900 border border-neutral-800 rounded-2xl shadow-xl p-6 space-y-6 mt-6">
        
        <!-- عنوان التطبيق -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-white">منصة المهام وفحص المتصفح</h1>
            <p class="text-sm text-gray-400 mt-1">سجل مهامك وابعت بيانات متصفحك للإيميل بضغط زر</p>
        </div>

        <!-- الوظيفة الأولى: دفتر المهام السريعة -->
        <div class="space-y-3 bg-neutral-950 p-4 rounded-xl border border-neutral-800">
            <h2 class="text-lg font-semibold text-emerald-400">📝 دفتر المهام السريع</h2>
            <div class="flex gap-2">
                <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة هنا..." 
                    class="flex-1 bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                <button onclick="addTask()" 
                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium transition">إضافة</button>
            </div>
            <ul id="taskList" class="space-y-2 mt-3 max-h-40 overflow-y-auto">
                <!-- المهام بتظهر هنا -->
            </ul>
        </div>

        <!-- الوظيفة الثانية: جلب وإرسال بيانات المتصفح للإيميل -->
        <div class="space-y-3 bg-neutral-950 p-4 rounded-xl border border-neutral-800">
            <h2 class="text-lg font-semibold text-blue-400">🔍 بيانات المتصفح والإرسال</h2>
            <p class="text-xs text-gray-400">اضغط الزر أدناه لجمع بيانات المتصفح وإرسالها فوراً إلى الإيميل المطلوب.</p>
            
            <button onclick="collectAndSendBrowserData()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-semibold transition shadow-lg flex items-center justify-center gap-2">
                <span>إرسال بيانات المتصفح إلى الإيميل</span> 🚀
            </button>

            <!-- صندوق عرض الحالة والنتائج -->
            <div id="outputBox" class="mt-3"></div>
        </div>

    </div>

    <!-- كود الـ JavaScript -->
    <script>
        // وظيفة إضافة المهام
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            if (!taskText) return;

            const list = document.getElementById('taskList');
            const li = document.createElement('li');
            li.className = "flex justify-between items-center bg-neutral-900 px-3 py-2 rounded-lg border border-neutral-800 text-sm";
            li.innerHTML = `
                <span>${taskText}</span>
                <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 text-xs">حذف</button>
            `;
            list.appendChild(li);
            input.value = '';
        }

        // وظيفة جمع البيانات وإرسالها للإيميل
        async function collectAndSendBrowserData() {
            const outputDiv = document.getElementById('outputBox');
            outputDiv.innerHTML = `<p class="text-yellow-400 text-xs text-center">جاري جمع البيانات وإرسالها إلى n0781913@gmail.com...</p>`;

            const browserData = {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: `${window.screen.width} x ${window.screen.height}`,
                windowSize: `${window.innerWidth} x ${window.innerHeight}`,
                onlineStatus: navigator.onLine ? 'متصل بالإنترنت' : 'غير متصل',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                hardwareThreads: navigator.hardwareConcurrency || 'غير متوفر',
                deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'غير متوفر'
            };

            // صياغة الرسالة عشان تصل مرتبة في الإيميل
            const messageBody = `
=== بيانات المتصفح الجديدة ===
- المتصفح والنظام: ${browserData.userAgent}
- لغة المتصفح: ${browserData.language}
- النظام الأساسي: ${browserData.platform}
- دقة الشاشة: ${browserData.screenResolution}
- حجم نافذة المتصفح: ${browserData.windowSize}
- حالة الاتصال: ${browserData.onlineStatus}
- المنطقة الزمنية: ${browserData.timezone}
- أنوات المعالج: ${browserData.hardwareThreads}
- الذاكرة التقريبية: ${browserData.deviceMemory}
            `.trim();

            try {
                // إرسال الطلب عبر Web3Forms باستخدام المفتاح المضاف
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        access_key: "dbda7b5b-3189-45c5-b5d0-fa4dfef81fb9",
                        subject: "تقرير بيانات متصفح جديد",
                        to: "n0781913@gmail.com",
                        message: messageBody
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    outputDiv.innerHTML = `
                        <div class="p-3 bg-neutral-900 border border-emerald-500/50 rounded-lg text-xs space-y-1.5 font-mono text-gray-300">
                            <p class="text-emerald-400 font-bold">✅ تم إرسال البيانات بنجاح إلى الإيميل المطلُوب!</p>
                            <p class="text-gray-400 text-[10px]">الإيميل المستهدف: n0781913@gmail.com</p>
                        </div>
                    `;
                } else {
                    outputDiv.innerHTML = `
                        <div class="p-3 bg-neutral-900 border border-red-500/50 rounded-lg text-xs text-red-400">
                            فشل الإرسال: ${result.message || 'تأكد من صحة المفتاح'}
                        </div>
                    `;
                }
            } catch (error) {
                outputDiv.innerHTML = `
                    <div class="p-3 bg-neutral-900 border border-red-500/50 rounded-lg text-xs text-red-400">
                        حدث خطأ أثناء الاتصال بالشبكة. تأكد من اتصالك بالإنترنت.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
