<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIRO X - Educational Demo</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Courier New', monospace;
  }

  body {
    background: #000;
    color: #00aaff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  .title {
    font-size: 2.8rem;
    font-weight: bold;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 40px;
    background: linear-gradient(
      90deg,
      #00aaff, #00ffcc, #aa00ff, #ff00aa, #00aaff
    );
    background-size: 400% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbFlow 4s linear infinite;
    text-shadow: 0 0 30px rgba(0, 170, 255, 0.5);
  }

  @keyframes rgbFlow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }

  .input-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .bracket {
    font-size: 2.5rem;
    color: #00aaff;
    text-shadow: 0 0 15px #00aaff;
    font-weight: bold;
  }

  .country-select {
    background: #001122;
    color: #00aaff;
    border: 2px solid #00aaff;
    border-radius: 8px;
    padding: 10px 15px;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    box-shadow: 0 0 10px rgba(0, 170, 255, 0.4);
    transition: 0.3s;
  }

  .country-select:hover,
  .country-select:focus {
    box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
  }

  .phone-input {
    background: #001122;
    color: #00aaff;
    border: 2px solid #00aaff;
    border-radius: 8px;
    padding: 10px 15px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    width: 220px;
    box-shadow: 0 0 10px rgba(0, 170, 255, 0.4);
    transition: 0.3s;
  }

  .phone-input::placeholder {
    color: rgba(0, 170, 255, 0.5);
  }

  .phone-input:focus {
    box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
  }

  .send-btn {
    background: #001122;
    color: #00aaff;
    border: 2px solid #00aaff;
    border-radius: 8px;
    padding: 12px 45px;
    font-size: 1.1rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
    transition: 0.3s;
    margin-bottom: 30px;
  }

  .send-btn:hover:not(:disabled) {
    background: #00aaff;
    color: #000;
    box-shadow: 0 0 30px rgba(0, 170, 255, 0.9);
  }

  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .console {
    width: 100%;
    max-width: 700px;
    height: 350px;
    background: #000811;
    border: 2px solid #00aaff;
    border-radius: 10px;
    padding: 15px;
    overflow-y: auto;
    font-size: 0.9rem;
    box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
    display: none;
  }

  .console.visible {
    display: block;
  }

  .console-line {
    margin-bottom: 5px;
    color: #00ffaa;
    text-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .console-line.final {
    color: #ffaa00;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(255, 170, 0, 0.9);
    font-size: 1rem;
    margin-top: 10px;
  }

  .console::-webkit-scrollbar {
    width: 8px;
  }
  .console::-webkit-scrollbar-track {
    background: #000;
  }
  .console::-webkit-scrollbar-thumb {
    background: #00aaff;
    border-radius: 4px;
  }
</style>
</head>
<body>

  <h1 class="title">WELCOME TO SPIRO X</h1>

  <div class="input-container">
    <span class="bracket">(</span>

    <select class="country-select" id="countrySelect">
      <option value="+966">🇸🇦 السعودية +966</option>
      <option value="+971">🇦🇪 الإمارات +971</option>
      <option value="+20">🇪🇬 مصر +20</option>
      <option value="+964">🇮🇶 العراق +964</option>
      <option value="+962">🇯🇴 الأردن +962</option>
      <option value="+965">🇰🇼 الكويت +965</option>
      <option value="+974">🇶🇦 قطر +974</option>
      <option value="+973">🇧🇭 البحرين +973</option>
      <option value="+968">🇴🇲 عمان +968</option>
      <option value="+967">🇾🇪 اليمن +967</option>
      <option value="+212">🇲🇦 المغرب +212</option>
      <option value="+213">🇩🇿 الجزائر +213</option>
      <option value="+216">🇹🇳 تونس +216</option>
      <option value="+218">🇱🇾 ليبيا +218</option>
      <option value="+249">🇸🇩 السودان +249</option>
      <option value="+1">🇺🇸 أمريكا +1</option>
      <option value="+44">🇬🇧 بريطانيا +44</option>
      <option value="+49">🇩🇪 ألمانيا +49</option>
      <option value="+33">🇫🇷 فرنسا +33</option>
      <option value="+90">🇹🇷 تركيا +90</option>
    </select>

    <input
      type="tel"
      class="phone-input"
      id="phoneInput"
      placeholder="أدخل رقم الهاتف"
      maxlength="15"
    />

    <span class="bracket">)</span>
  </div>

  <button class="send-btn" id="sendBtn">إرسال</button>

  <div class="console" id="console"></div>

<script>
  const sendBtn     = document.getElementById('sendBtn');
  const consoleBox  = document.getElementById('console');
  const phoneInput  = document.getElementById('phoneInput');
  const countrySel  = document.getElementById('countrySelect');

  // دالة إضافة السطور إلى الشاشة
  function addLine(text, isFinal = false) {
    const div = document.createElement('div');
    div.className = 'console-line' + (isFinal ? ' final' : '');
    div.textContent = text;
    consoleBox.appendChild(div);
    consoleBox.scrollTop = consoleBox.scrollHeight;
  }

  sendBtn.addEventListener('click', function () {
    const phone = phoneInput.value.trim();
    if (phone === '') {
      alert('الرجاء إدخال رقم الهاتف أولاً');
      return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = 'جاري الإرسال...';

    consoleBox.classList.add('visible');
    consoleBox.innerHTML = '';

    const fullNumber = countrySel.value + phone;

    addLine(`بدء العملية على الرقم: ${fullNumber}`);

    let counter = 0;
    const TOTAL = 100;

    function sendOne() {
      counter++;
      addLine(`[${counter}/${TOTAL}] تم إرسال البلاغ ✔️`);

      if (counter < TOTAL) {
        setTimeout(sendOne, 150); // تم تسريع الوقت قليلاً لسرعة الاستجابة
      } else {
        setTimeout(() => {
          addLine('═══════════════════════════');
          addLine('تم إكمال العملية استمتع مع SPIRO X ☠️', true);
          addLine('═══════════════════════════');

          sendBtn.disabled = false;
          sendBtn.textContent = 'إرسال';
        }, 500);
      }
    }

    setTimeout(sendOne, 500);
  });
</script>

</body>
</html>
