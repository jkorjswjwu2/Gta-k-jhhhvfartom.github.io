<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Khartoum 3D - جي تي اي الخرطوم</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Start Screen Styling */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)), url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1200&q=80') center/cover;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }
        #start-screen h1 {
            font-size: 3.5rem;
            color: #f1c40f;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.8);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #start-screen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ddd;
        }
        .car-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .car-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 120px;
        }
        .car-card.selected {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.3);
            transform: scale(1.05);
        }
        .car-card h3 {
            font-size: 1rem;
            margin-top: 5px;
        }
        #play-btn {
            padding: 15px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #000;
            background-color: #f1c40f;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.6);
            transition: all 0.2s;
        }
        #play-btn:hover {
            transform: scale(1.1);
            background-color: #ffe054;
        }
        /* HUD UI */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            display: none;
        }
        .hud-top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 10px;
            color: #fff;
            border-right: 4px solid #f1c40f;
        }
        .hud-top-right h2 {
            font-size: 1.2rem;
            color: #f1c40f;
        }
        .hud-bottom-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            border: 3px solid #f1c40f;
        }
        .speed-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        .speed-unit {
            font-size: 0.7rem;
            color: #aaa;
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Main Canvas -->
    <div id="canvas-container"></div>

    <!-- Start Screen UI -->
    <div id="start-screen">
        <h1>GTA KHARTOUM</h1>
        <p>عالم مفتوح - مدينة الخرطوم 3D</p>
        
        <div class="car-selector">
            <div class="car-card selected" onclick="selectCar(0, this)">
                <div>🏎️</div>
                <h3>سريعة</h3>
            </div>
            <div class="car-card" onclick="selectCar(1, this)">
                <div>🚗</div>
                <h3>سيدان</h3>
            </div>
            <div class="car-card" onclick="selectCar(2, this)">
                <div>🚙</div>
                <h3>دفع رباعي</h3>
            </div>
        </div>

        <button id="play-btn" onclick="startGame()">PLAY (ابدأ اللعب)</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">
        <div class="hud-top-right">
            <h2>الخرطوم - شارع النيل</h2>
            <p>الموقع: بالقرب من كبري النيل الأرزق</p>
        </div>
        
        <div class="hud-bottom-left">
            <span class="speed-val" id="speed-display">0</span>
            <span class="speed-unit">KM/H</span>
        </div>

        <div class="controls-hint">
            <b>التحكم:</b><br>
            • الحركة: أزرار الأسهم أو W A S D<br>
            • الفرامل: المسافة (Space)<br>
            • تغيير الكاميرا: C
        </div>
    </div>

    <script>
        // Game Logic & Three.js 3D Engine Setup
        let scene, camera, renderer, car, speed = 0, angle = 0;
        let keys = {};
        let selectedCarType = 0;
        let isGameStarted = false;

        const carColors = [0xe74c3c, 0x3498db, 0x2ecc71]; // Red, Blue, Green
        const carSpecs = [
            { maxSpeed: 1.8, accel: 0.03, handling: 0.04 }, // Sports
            { maxSpeed: 1.2, accel: 0.02, handling: 0.03 }, // Sedan
            { maxSpeed: 1.0, accel: 0.015, handling: 0.025 } // SUV
        ];

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky color
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            dirLight.position.set(100, 150, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Ground / Khartoum Environment
            buildKhartoumWorld();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('keydown', e => {
                if(e.key.toLowerCase() === 'c') toggleCamera();
            });
        }

        function buildKhartoumWorld() {
            // Ground (Sand/City Terrain)
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0xd2b48c }); // Sand tone
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Nile River (Blue Water Strip)
            const riverGeo = new THREE.PlaneGeometry(200, 1000);
            const riverMat = new THREE.MeshLambertMaterial({ color: 0x1e90ff });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(-200, 0.2, 0);
            scene.add(river);

            // Nile Bridge (Kobar / Blue Nile Bridge style)
            const bridgeGroup = new THREE.Group();
            const bridgeRoadGeo = new THREE.BoxGeometry(80, 2, 200);
            const bridgeMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const bridgeRoad = new THREE.Mesh(bridgeRoadGeo, bridgeMat);
            bridgeRoad.position.set(-200, 10, 0);
            bridgeGroup.add(bridgeRoad);

            // Bridge Arches / Arches Metal
            for (let z = -80; z <= 80; z += 40) {
                const archGeo = new THREE.TorusGeometry(35, 1.5, 8, 20, Math.PI);
                const archMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
                const arch = new THREE.Mesh(archGeo, archMat);
                arch.position.set(-200, 10, z);
                arch.rotation.y = Math.PI / 2;
                bridgeGroup.add(arch);
            }
            scene.add(bridgeGroup);

            // Main Nile Street (Road)
            const roadGeo = new THREE.PlaneGeometry(30, 1000);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0.1, 0);
            scene.add(road);

            // Khartoum Buildings & Palms
            createCityBuildings();
        }

        function createCityBuildings() {
            const buildingMat = new THREE.MeshLambertMaterial({ color: 0xe0d5c1 });
            
            for (let i = 0; i < 40; i++) {
                const h = 15 + Math.random() * 40;
                const w = 15 + Math.random() * 10;
                const bGeo = new THREE.BoxGeometry(w, h, w);
                const building = new THREE.Mesh(bGeo, buildingMat);
                
                // Position along sides of the road
                const side = Math.random() > 0.5 ? 1 : -1;
                const posX = side * (40 + Math.random() * 80);
                const posZ = (Math.random() - 0.5) * 800;

                building.position.set(posX, h / 2, posZ);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            }

            // Add Palm Trees along the road
            for (let z = -450; z < 450; z += 30) {
                createPalmTree(18, z);
                createPalmTree(-18, z);
            }
        }

        function createPalmTree(x, z) {
            const palmGroup = new THREE.Group();
            
            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.8, 10, 8);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 5;
            palmGroup.add(trunk);

            // Leaves
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
            for (let i = 0; i < 5; i++) {
                const leafGeo = new THREE.BoxGeometry(0.3, 0.2, 5);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(0, 10, 2);
                leaf.rotation.x = 0.5;
                leaf.rotation.y = (i * Math.PI * 2) / 5;
                palmGroup.add(leaf);
            }

            palmGroup.position.set(x, 0, z);
            scene.add(palmGroup);
        }

        function createCar(typeIndex) {
            if (car) scene.remove(car);

            car = new THREE.Group();
            const color = carColors[typeIndex];

            // Body
            const bodyGeo = new THREE.BoxGeometry(2.2, 1, 4.5);
            const bodyMat = new THREE.MeshLambertMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            car.add(body);

            // Cabin / Roof
            const cabinGeo = new THREE.BoxGeometry(1.8, 0.8, 2.2);
            const cabinMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.5, -0.3);
            car.add(cabin);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            
            const positions = [
                [-1.1, 0.4, 1.3],
                [1.1, 0.4, 1.3],
                [-1.1, 0.4, -1.3],
                [1.1, 0.4, -1.3]
            ];

            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                car.add(wheel);
            });

            car.position.set(0, 0, 0);
            scene.add(car);
        }

        function selectCar(index, element) {
            selectedCarType = index;
            document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            
            initScene();
            createCar(selectedCarType);
            isGameStarted = true;
            
            animate();
        }

        let camMode = 0;
        function toggleCamera() {
            camMode = (camMode + 1) % 2;
        }

        function updatePhysics() {
            const spec = carSpecs[selectedCarType];

            // Acceleration & Steering Controls
            if (keys['w'] || keys['arrowup']) {
                if (speed < spec.maxSpeed) speed += spec.accel;
            } else if (keys['s'] || keys['arrowdown']) {
                if (speed > -spec.maxSpeed / 2) speed -= spec.accel;
            } else {
                speed *= 0.96; // Friction
            }

            if (keys[' ']) { // Handbrake
                speed *= 0.85;
            }

            if (Math.abs(speed) > 0.05) {
                const dir = speed > 0 ? 1 : -1;
                if (keys['a'] || keys['arrowleft']) angle += spec.handling * dir;
                if (keys['d'] || keys['arrowright']) angle -= spec.handling * dir;
            }

            // Update Car Position
            car.rotation.y = angle;
            car.position.x += Math.sin(angle) * speed;
            car.position.z += Math.cos(angle) * speed;

            // Camera Follow Setup
            if (camMode === 0) {
                // Smooth Third-Person Camera
                const camOffset = new THREE.Vector3(0, 5, -12).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
                camera.position.copy(car.position).add(camOffset);
                camera.lookAt(car.position.x, car.position.y + 1.5, car.position.z);
            } else {
                // Top-Down Map View
                camera.position.set(car.position.x, car.position.y + 35, car.position.z);
                camera.lookAt(car.position);
            }

            // HUD Speedometer Update
            const displaySpeed = Math.round(Math.abs(speed) * 80);
            document.getElementById('speed-display').innerText = displaySpeed;
        }

        function animate() {
            if (!isGameStarted) return;
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
