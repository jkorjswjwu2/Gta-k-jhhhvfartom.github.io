<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عزام تاج السر استايل - استوديو الذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161e;
            --accent-glow: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e2e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(99, 102, 241, 0.1);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Upload Area */
        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            overflow: hidden;
        }

        .upload-box:hover, .upload-box.dragover {
            border-color: var(--accent-glow);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 40px;
            color: var(--accent-glow);
            margin-bottom: 10px;
        }

        .upload-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            display: none;
            margin: 0 auto;
            object-fit: contain;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Textarea Input */
        .input-group {
            margin-top: 25px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #0f0f15;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        textarea::placeholder {
            color: #6b7280;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Status & Output */
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: #0f0f15;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .result-box h3 {
            font-size: 1rem;
            color: var(--accent-glow);
            margin-bottom: 8px;
        }

        .result-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e5e7eb;
            white-space: pre-wrap;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
            .container { padding: 18px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>عزام تاج السر استايل</h1>
        <p>استوديو الذكاء الاصطناعي لمعالجة الصور وتفيذ الأوامر</p>
    </header>

    <div class="container">
        <!-- 1. رفع الصورة -->
        <div class="section-title">
            <span>📷</span> رفع الصورة من هاتفك
        </div>
        <div class="upload-box" id="uploadBox">
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <div id="uploadPlaceholder">
                <div class="upload-icon">📁</div>
                <div class="upload-text">اضغط هنا أو اسحب الصورة لترفعها</div>
            </div>
            <img id="imagePreview" class="preview-img" alt="معاينة الصورة">
        </div>

        <!-- 2. كتابة التعليمات -->
        <div class="input-group">
            <div class="section-title">
                <span>✨</span> اكتب عايز الذكاء الاصطناعي يعمل شنو بالصورة
            </div>
            <textarea id="promptInput" placeholder="مثال: أوصف الصورة دي بالتفصيل، أو عدل الإضاءة وخليها دافئة، أو حول الصورة لـ أنمي..."></textarea>
        </div>

        <!-- زر التنفيذ -->
        <button class="btn-submit" onclick="processAI()">تشغيل الذكاء الاصطناعي 🚀</button>

        <!-- منطقة النتيجة -->
        <div class="result-box" id="resultBox">
            <h3>النتيجة:</h3>
            <div class="result-content" id="resultText">جاري المعالجة...</div>
        </div>
    </div>

    <script>
        // معاينة الصورة فور اختيارها
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // محاكاة زر تشغيل الذكاء الاصطناعي
        function processAI() {
            const imageInput = document.getElementById('imageInput');
            const promptInput = document.getElementById('promptInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (!imageInput.files || !imageInput.files[0]) {
                alert('يرجى اختيار صورة من جهازك أولاً!');
                return;
            }

            if (!promptInput) {
                alert('يرجى كتابة المطلوب في خانة النص!');
                return;
            }

            resultBox.style.display = 'block';
            resultText.innerText = '⏳ جاري تحليل الصورة وتنفيذ الطلب عبر الذكاء الاصطناعي...';

            // هنا يتم الربط مع API الخاص بالذكاء الاصطناعي
            setTimeout(() => {
                resultText.innerText = `تم استلام الطلب بنجاح!\n\nالطلب: "${promptInput}"\n\n(جاهز للربط الفعلي مع Gemini Vision API أو أي خادم backend من اختيارك).`;
            }, 1500);
        }
    </script>
</body>
</html>
